<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-3">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-4 shadow-sm space-y-3 max-w-2xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between gap-2 border-b border-[var(--border)] pb-2.5">
      <div class="flex items-center space-x-2 min-w-0">
        <span class="inline-flex items-center shrink-0 px-2 py-0.5 rounded text-xs font-medium bg-[var(--foreground)] text-[var(--card)]">
          ⚡ 经验与品味规则沉淀
        </span>
        <span class="text-sm font-semibold truncate">{{TASK_TITLE}}</span>
      </div>
      <span class="text-xs text-[var(--muted-foreground)] shrink-0 font-mono">{{MODE_LABEL}}</span>
    </div>

    <!-- Dual Summary Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5 text-xs">
      <div class="bg-[var(--background)] p-2.5 rounded-lg border border-[var(--border)]">
        <div class="font-medium text-[var(--foreground)] mb-1 flex items-center gap-1">
          <span>🎯</span> <span>五维纠偏信号捕获</span>
        </div>
        <p class="text-[var(--muted-foreground)] leading-relaxed">{{SIGNAL_SUMMARY}}</p>
      </div>

      <div class="bg-[var(--background)] p-2.5 rounded-lg border border-[var(--border)]">
        <div class="font-medium text-[var(--foreground)] mb-1 flex items-center gap-1">
          <span>🛡️</span> <span>规则动作与目标文件</span>
        </div>
        <p class="text-[var(--muted-foreground)] leading-relaxed">{{RULE_ACTION_SUMMARY}}</p>
        <p class="text-[var(--muted-foreground)] leading-relaxed font-mono mt-1 truncate">{{TARGET_RULE_FILE}}</p>
      </div>
    </div>

    <!-- Rule & Check Patch Diff Box -->
    <div class="space-y-1">
      <div class="text-xs font-medium text-[var(--foreground)] flex justify-between items-center">
        <span>建议合入的规则 / 检查补丁 (Rule &amp; Check Diff)</span>
        <span class="text-xs text-[var(--muted-foreground)]">Propose Then Stop · 审批后落盘</span>
      </div>
      <pre class="bg-[var(--background)] border border-[var(--border)] p-2.5 rounded-lg text-xs font-mono text-[var(--foreground)] overflow-x-auto leading-tight max-h-36">{{DIFF_CONTENT}}</pre>
    </div>

    <!-- Footer Action Hint -->
    <div class="pt-1 flex items-center justify-between text-xs text-[var(--muted-foreground)]">
      <span>回复 <strong class="text-[var(--foreground)]">“写入全部”</strong> 或 <strong class="text-[var(--foreground)]">“写入 1, 3”</strong> 按编号落盘</span>
      <span class="text-xs opacity-75 font-mono">agent-mind · arch-improve</span>
    </div>
  </div>
</body>
</html>
